<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caving Terminology | Mining & Geotechnical Engineering</title>

<style>
:root{
    --bg:#0b0d0f;
    --bg2:#121518;
    --card:#181c20;
    --card-hover:#20252a;
    --text:#f4f4f2;
    --muted:#a7adb2;
    --accent:#c99545;
    --accent2:#e3b66c;
    --border:#2d3338;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:570px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            rgba(5,7,8,.58),
            rgba(5,7,8,.92)
        ),
        url("https://images.unsplash.com/photo-1513828583688-c52646db42da?auto=format&fit=crop&w=2200&q=90")
        center/cover no-repeat;
}

.hero-content{
    width:min(1000px,92%);
    padding:40px 20px;
}

.mining-icon{
    font-size:62px;
    margin-bottom:15px;
}

.hero h1{
    font-size:
        clamp(42px,7vw,82px);

    font-weight:800;

    letter-spacing:
        clamp(2px,1vw,7px);

    line-height:1.05;

    margin-bottom:20px;
}

.hero h1 span{
    color:var(--accent2);
}

.hero-main-text{
    font-size:22px;
    color:#eee;
}

.hero-sub{
    margin-top:8px;

    color:var(--accent2);

    font-size:16px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================
   THEME BUTTON
========================= */

.theme-button{
    position:absolute;

    top:25px;
    right:25px;

    border:1px solid rgba(255,255,255,.3);

    background:rgba(0,0,0,.4);

    color:white;

    padding:11px 17px;

    border-radius:30px;

    cursor:pointer;

    backdrop-filter:blur(8px);

    font-size:14px;
}

.theme-button:hover{
    background:var(--accent);
}


/* =========================
   MAIN
========================= */

.container{
    width:min(1250px,92%);
    margin:auto;
}


/* =========================
   SEARCH
========================= */

.search-wrapper{
    margin-top:-50px;

    position:relative;

    z-index:5;
}

.search-container{
    background:var(--card);

    border:1px solid var(--border);

    padding:22px;

    border-radius:20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.search-input{
    width:100%;

    padding:20px 24px;

    border-radius:14px;

    border:1px solid var(--border);

    background:var(--bg2);

    color:var(--text);

    font-size:18px;

    outline:none;
}

.search-input:focus{
    border-color:var(--accent);
}

.search-input::placeholder{
    color:#777;
}


/* =========================
   STATISTICS
========================= */

.stats{
    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;

    margin:35px 0;
}

.stat-card{
    min-width:190px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    padding:20px 30px;

    text-align:center;
}

.stat-number{
    font-size:31px;

    font-weight:800;

    color:var(--accent2);
}

.stat-label{
    color:var(--muted);

    font-size:14px;
}


/* =========================
   ALPHABET
========================= */

.alphabet{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:7px;

    margin-bottom:35px;
}

.letter{
    width:39px;
    height:39px;

    border-radius:8px;

    border:1px solid var(--border);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

.letter:hover{
    border-color:var(--accent);

    color:var(--accent2);
}

.letter.active{
    background:var(--accent);

    color:white;

    border-color:var(--accent);
}


/* =========================
   GLOSSARY
========================= */

.glossary{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(310px,1fr)
        );

    gap:20px;

    padding-bottom:70px;
}

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:18px;

    padding:25px;

    cursor:pointer;

    transition:
        transform .25s,
        border .25s,
        background .25s;

    min-height:215px;
}

.card:hover{
    transform:translateY(-6px);

    border-color:var(--accent);

    background:var(--card-hover);
}

.card-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;
}

.card-letter{
    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(201,149,69,.12);

    border:
        1px solid
        rgba(201,149,69,.3);

    border-radius:9px;

    color:var(--accent2);

    font-weight:bold;
}

.english{
    color:var(--accent2);

    font-size:21px;

    font-weight:750;

    line-height:1.25;

    flex:1;
}

.mongolian{
    font-size:16px;

    font-weight:bold;

    margin-top:13px;

    color:var(--text);
}

.definition{
    color:var(--muted);

    font-size:14px;

    margin-top:13px;

    display:
        -webkit-box;

    -webkit-line-clamp:4;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.view-details{
    color:var(--accent2);

    font-size:13px;

    margin-top:16px;

    font-weight:bold;
}


/* =========================
   LOADING
========================= */

.loading{
    grid-column:1/-1;

    text-align:center;

    padding:80px;

    color:var(--muted);
}

.spinner{
    width:45px;
    height:45px;

    border:3px solid var(--border);

    border-top-color:var(--accent);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:0 auto 20px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   NO RESULTS
========================= */

.no-results{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:var(--muted);
}

.no-results-icon{
    font-size:45px;

    margin-bottom:10px;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(8px);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(780px,100%);

    max-height:90vh;

    overflow:auto;

    background:var(--card);

    border:
        1px solid
        var(--border);

    border-radius:22px;

    padding:38px;

    position:relative;

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);
}

.close{
    position:absolute;

    right:20px;
    top:15px;

    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:var(--muted);

    font-size:27px;
}

.close:hover{
    background:var(--bg2);

    color:white;
}

.modal-english{
    color:var(--accent2);

    font-size:
        clamp(27px,5vw,40px);

    font-weight:800;

    line-height:1.2;

    padding-right:35px;
}

.modal-mongolian{
    font-size:21px;

    font-weight:bold;

    margin-top:8px;

    margin-bottom:30px;
}

.info-title{
    color:var(--accent2);

    font-weight:bold;

    font-size:15px;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-top:25px;

    margin-bottom:8px;
}

.info-text{
    color:var(--muted);

    font-size:16px;
}


/* =========================
   FOOTER
========================= */

footer{
    border-top:
        1px solid
        var(--border);

    padding:35px 20px;

    text-align:center;

    color:var(--muted);
}

footer strong{
    color:var(--accent2);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .hero{
        min-height:500px;
    }

    .theme-button{
        top:15px;
        right:15px;
    }

    .mining-icon{
        font-size:48px;
    }

    .hero-main-text{
        font-size:18px;
    }

    .search-wrapper{
        margin-top:-35px;
    }

    .search-container{
        padding:15px;
    }

    .search-input{
        font-size:16px;
        padding:17px;
    }

    .glossary{
        grid-template-columns:1fr;
    }

    .modal-box{
        padding:28px 22px;
    }

}
</style>
</head>


<body>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <button
        class="theme-button"
        onclick="toggleTheme()"
        id="themeButton">

        🌙 Dark

    </button>


    <div class="hero-content">

        <div class="mining-icon">
            ⛏️
        </div>

        <h1>
            CAVING <span>TERMINOLOGY</span>
        </h1>

        <div class="hero-main-text">
            English → Монгол
        </div>

        <div class="hero-sub">
            Mining & Geotechnical Engineering
        </div>

    </div>

</section>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- SEARCH -->

    <section class="search-wrapper">

        <div class="search-container">

            <input
                class="search-input"
                id="searchInput"
                type="text"
                placeholder="🔎  Search English term or Монгол нэр..."
                autocomplete="off"
            >

        </div>

    </section>



    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-card">

            <div
                class="stat-number"
                id="termCount">

                0

            </div>

            <div class="stat-label">
                Glossary Terms
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-number">
                A–Z
            </div>

            <div class="stat-label">
                Alphabetical Index
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-number">
                EN → MN
            </div>

            <div class="stat-label">
                Bilingual Glossary
            </div>

        </div>

    </section>



    <!-- ALPHABET -->

    <div
        class="alphabet"
        id="alphabet">

    </div>



    <!-- GLOSSARY -->

    <section
        class="glossary"
        id="glossary">

        <div class="loading">

            <div class="spinner"></div>

            Loading Caving Terminology...

        </div>

    </section>


</main>



<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div
            class="close"
            onclick="closeModal()">

            ×

        </div>


        <div
            class="modal-english"
            id="modalEnglish">

        </div>


        <div
            class="modal-mongolian"
            id="modalMongolian">

        </div>


        <div class="info-title">
            English Definition
        </div>

        <div
            class="info-text"
            id="modalEnglishDefinition">

        </div>


        <div class="info-title">
            Монгол тайлбар
        </div>

        <div
            class="info-text"
            id="modalMongolianDefinition">

        </div>

    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <strong>
        Caving Terminology Glossary
    </strong>

    <br>

    Mining & Geotechnical Engineering

</footer>



<script>


/* =====================================
   GOOGLE SHEETS
===================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQzzKTwRYU8uWvuANW0d7s-I5xK4uwF0QhwJIiQlCWGYZX0MbkLXvOTQ6yfJdzPmT38ykXIFpWIK36R/pub?gid=129970236&single=true&output=csv";


let glossaryData = [];

let selectedLetter = "ALL";


/* =====================================
   CSV PARSER
===================================== */

function parseCSV(csv){

    const rows = [];

    let row = [];

    let value = "";

    let quotes = false;


    for(let i=0;i<csv.length;i++){

        const char = csv[i];

        const next = csv[i+1];


        if(char === '"' && quotes && next === '"'){

            value += '"';

            i++;

        }

        else if(char === '"'){

            quotes = !quotes;

        }

        else if(char === ',' && !quotes){

            row.push(value);

            value = "";

        }

        else if(
            (char === '\n' || char === '\r')
            && !quotes
        ){

            if(
                char === '\r'
                && next === '\n'
            ){

                i++;

            }

            row.push(value);

            rows.push(row);

            row = [];

            value = "";

        }

        else{

            value += char;

        }

    }


    if(value || row.length){

        row.push(value);

        rows.push(row);

    }


    return rows;

}


/* =====================================
   LOAD GOOGLE SHEET
===================================== */

async function loadGlossary(){

    const glossary =
        document.getElementById("glossary");


    try{

        const response =
            await fetch(
                CSV_URL +
                "&cache=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "Google Sheet could not be loaded"
            );

        }


        const csv =
            await response.text();


        const rows =
            parseCSV(csv);


        if(rows.length < 2){

            throw new Error(
                "No glossary data"
            );

        }


        const headers =
            rows[0].map(
                header =>
                header.trim()
            );


        glossaryData =
            rows.slice(1)

            .map(row => {

                const item = {};

                headers.forEach(
                    (header,index) => {

                        item[header] =
                            (
                                row[index]
                                || ""
                            ).trim();

                    }
                );

                return item;

            })

            .filter(item =>
                item["English Term"]
                &&
                item["English Term"]
                    .trim() !== ""
            );


        glossaryData.sort(
            (a,b) =>
                a["English Term"]
                .localeCompare(
                    b["English Term"]
                )
        );


        document
            .getElementById("termCount")
            .textContent =
            glossaryData.length + "+";


        createAlphabet();

        renderGlossary();


    }
    catch(error){

        console.error(error);


        glossary.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">
                    ⚠️
                </div>

                <h3>
                    Glossary could not be loaded
                </h3>

                <p>
                    Please check your Google Sheet
                    publishing settings.
                </p>

            </div>

        `;

    }

}


/* =====================================
   ALPHABET
===================================== */

function createAlphabet(){

    const alphabet =
        document.getElementById("alphabet");


    alphabet.innerHTML = "";


    const all =
        document.createElement("button");


    all.className =
        "letter active";


    all.textContent =
        "ALL";


    all.onclick = function(){

        selectedLetter = "ALL";

        setActiveLetter(this);

        renderGlossary();

    };


    alphabet.appendChild(all);


    "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        .split("")
        .forEach(letter => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "letter";


            button.textContent =
                letter;


            button.onclick =
                function(){

                    selectedLetter =
                        letter;

                    setActiveLetter(
                        this
                    );

                    renderGlossary();

                };


            alphabet.appendChild(button);

        });

}


function setActiveLetter(button){

    document
        .querySelectorAll(".letter")
        .forEach(btn =>
            btn.classList.remove(
                "active"
            )
        );


    button.classList.add("active");

}


/* =====================================
   RENDER GLOSSARY
===================================== */

function renderGlossary(){

    const container =
        document.getElementById(
            "glossary"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const results =
        glossaryData.filter(item => {


            const english =
                (
                    item["English Term"]
                    || ""
                ).toLowerCase();


            const mongolian =
                (
                    item["Монгол нэр"]
                    || ""
                ).toLowerCase();


            const englishDefinition =
                (
                    item["English Definition"]
                    || ""
                ).toLowerCase();


            const mongolianDefinition =
                (
                    item["Монгол тайлбар"]
                    || ""
                ).toLowerCase();


            const letterMatch =
                selectedLetter === "ALL"
                ||
                english.startsWith(
                    selectedLetter.toLowerCase()
                );


            const searchMatch =
                !search
                ||
                english.includes(search)
                ||
                mongolian.includes(search)
                ||
                englishDefinition.includes(search)
                ||
                mongolianDefinition.includes(search);


            return (
                letterMatch
                &&
                searchMatch
            );

        });


    if(results.length === 0){

        container.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">
                    🔍
                </div>

                <h3>
                    No terms found
                </h3>

                <p>
                    Try another English or
                    Mongolian keyword.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        results.map(item => {


            const index =
                glossaryData.indexOf(
                    item
                );


            const english =
                escapeHTML(
                    item["English Term"]
                    || "—"
                );


            const mongolian =
                escapeHTML(
                    item["Монгол нэр"]
                    || "—"
                );


            const definition =
                escapeHTML(
                    item["English Definition"]
                    || "No definition available."
                );


            const firstLetter =
                (
                    item["English Term"]
                    || "?"
                )
                .charAt(0)
                .toUpperCase();


            return `

                <article
                    class="card"
                    onclick="openModal(${index})"
                >

                    <div class="card-top">

                        <div class="english">
                            ${english}
                        </div>

                        <div class="card-letter">
                            ${firstLetter}
                        </div>

                    </div>


                    <div class="mongolian">
                        ${mongolian}
                    </div>


                    <div class="definition">
                        ${definition}
                    </div>


                    <div class="view-details">
                        View full definition →
                    </div>

                </article>

            `;

        }).join("");

}


/* =====================================
   SEARCH
===================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderGlossary
    );


/* =====================================
   MODAL
===================================== */

function openModal(index){

    const item =
        glossaryData[index];


    if(!item) return;


    document
        .getElementById(
            "modalEnglish"
        )
        .textContent =
        item["English Term"]
        || "—";


    document
        .getElementById(
            "modalMongolian"
        )
        .textContent =
        item["Монгол нэр"]
        || "—";


    document
        .getElementById(
            "modalEnglishDefinition"
        )
        .textContent =
        item["English Definition"]
        || "—";


    document
        .getElementById(
            "modalMongolianDefinition"
        )
        .textContent =
        item["Монгол тайлбар"]
        || "—";


    document
        .getElementById("modal")
        .classList.add("active");


    document.body.style.overflow =
        "hidden";

}


function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("active");


    document.body.style.overflow =
        "";

}


document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );


document
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Escape"){

                closeModal();

            }

        }
    );


/* =====================================
   DARK / LIGHT
===================================== */

function toggleTheme(){

    const body =
        document.body;


    body.classList.toggle(
        "light"
    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   START WEBSITE
===================================== */

loadGlossary();

</script>

</body>
</html>
